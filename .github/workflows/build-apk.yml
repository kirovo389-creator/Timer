name: Build Timer APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timer-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Timer-v1.2-${GITHUB_RUN_NUMBER}.apk"
          test -s "release/Timer-v1.2-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "release/Timer-v1.2-${GITHUB_RUN_NUMBER}.apk" | tee release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timer-v1.2-debug-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: timer-build-${{ github.run_number }}
          name: Timer v1.2 — Build ${{ github.run_number }}
          body: |
            ## Timer v1.2

            Обновлённый тёмный интерфейс, аккуратная типографика, градиентный фон,
            карточка живого отсчёта и плавное появление экрана.

            APK автоматически собран GitHub Actions. SHA-256 находится в SHA256SUMS.txt.
          files: |
            release/Timer-v1.2-${{ github.run_number }}.apk
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

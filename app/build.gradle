plugins {
    id 'com.android.application'
}

android {
    namespace 'com.telega.timer'
    compileSdk 35

    defaultConfig {
        applicationId "com.telega.timer"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies: all graphics use the Android SDK Canvas.
dependencies {
}

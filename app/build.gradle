plugins {
    id 'com.android.application'
}

android {
    namespace 'com.telega.timer'
    compileSdk 35

    defaultConfig {
        applicationId "com.telega.timer"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Никаких зависимостей: приложение рисует всё на Canvas стандартным SDK.
dependencies {
}
